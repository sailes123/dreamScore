services:
  postgres:
    image: postgres:16-alpine
    container_name: arenaops-postgres
    environment:
      POSTGRES_DB: arenaops
      POSTGRES_USER: arenaops
      POSTGRES_PASSWORD: arenaops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenaops -d arenaops"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
